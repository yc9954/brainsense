[project]
name = "brainsense"
version = "0.1.0"
description = "Grounded-opinion agent: Meta glasses -> TRIBE v2 brain encoder -> calibrated heads -> Muse/Llama agent"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "pandas>=2.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "openai>=1.50",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "modal>=1.6.2",
    "pyarrow>=26.0.0",
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Cloud inference side (installed inside the Modal image, not locally on the Mac)
gpu = ["torch>=2.4", "torchvision", "torchaudio", "modal>=1.0", "nibabel", "nilearn"]
dev = ["pytest>=8", "ruff"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF100"]
ignore = ["E501", "E702"]
